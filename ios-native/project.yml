name: Purrly
options:
  bundleIdPrefix: app.purrly
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: "SPLML3CN76"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    GENERATE_INFOPLIST_FILE: NO
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1
targets:
  Purrly:
    type: application
    platform: iOS
    sources:
      - path: Purrly
        excludes:
          - Resources/Secrets.xcconfig
    resources:
      - path: Purrly/Resources/breeds.json
      - path: Purrly/Resources/Localizable.xcstrings
      - path: Purrly/Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        INFOPLIST_FILE: Purrly/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.purrly.raceguide
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    configFiles:
      Debug: Purrly/Resources/Secrets.xcconfig
      Release: Purrly/Resources/Secrets.xcconfig
    info:
      path: Purrly/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Purrly utilise la caméra pour identifier la race de votre chat."
        NSPhotoLibraryUsageDescription: "Purrly accède à vos photos pour analyser la race de votre chat."
        NSLocationWhenInUseUsageDescription: "Purrly utilise votre position pour trouver des vétérinaires et éleveurs à proximité."
        NSPhotoLibraryAddUsageDescription: "Purrly sauvegarde vos photos Photo Booth dans votre galerie."
        KIE_API_KEY: $(KIE_API_KEY)
  PurrlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PurrlyTests
    dependencies:
      - target: Purrly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrly.raceguide.tests
        GENERATE_INFOPLIST_FILE: YES
